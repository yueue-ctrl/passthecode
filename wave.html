<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pass the Code — Type waves</title>
  <link rel="stylesheet" href="wave.css?v=wave-grid-top">
  <script src="wave-grid.js?v=wave-grid-top" defer></script>
  <script src="wave.js?v=wave-grid-top" defer></script>
  <link rel="stylesheet" href="cursors.css?v=uniform-size">
  <script src="cursors.js?v=natural-cone-base" defer></script>
</head>
<body>
  <button id="wave-settings-toggle" type="button" aria-expanded="false" aria-label="Toggle poster settings">Settings</button>
  <main class="workspace fullscreen-format poster-format">
    <section class="preview" aria-label="Music responsive variable typography">
      <div class="poster" id="poster">
        <div id="background-media" aria-hidden="true"></div>
        <div id="bands" aria-hidden="true"></div>
        <article id="composition"></article>
      </div>
      <span id="mode" class="wave-status" role="status"></span>
    </section>
    <aside class="settings" aria-label="Composition controls" inert>
      <a class="back" href="./">↖ Back to editor</a>
      <a class="back" href="cursor-demo.html" style="float:right">Cursor demo ↗</a>
      <label class="text-label" for="poster-format">Format</label>
      <select id="poster-format"><option value="poster">Poster</option><option value="single">Single-line poster</option><option value="grid">Kinetic grid</option></select>
      <div class="single-word-settings">
        <label class="text-label" for="rotating-word">Pass the…</label>
        <select id="rotating-word"><option value="auto">Auto · all words</option><option value="code">Code</option><option value="possibility">Possibility</option><option value="idea">Idea</option><option value="imagination">Imagination</option><option value="spark">Spark</option><option value="unexpected">Unexpected</option><option value="mic">Mic</option><option value="surprise">Surprise</option><option value="bug">Bug</option><option value="fun">Fun</option><option value="challenge">Challenge</option><option value="lead">Lead</option></select>
      </div>
      <div class="grid-mode-controls">
        <label class="range-label" for="grid-motion">Grid motion <output id="grid-motion-value">80%</output></label>
        <input id="grid-motion" type="range" min="0" max="100" value="80">
        <label class="range-label" for="grid-speed">Grid speed <output id="grid-speed-value">1.0×</output></label>
        <input id="grid-speed" type="range" min="40" max="180" step="5" value="100">
      </div>
      <label class="text-label" for="copy">Text</label>
      <textarea id="copy" spellcheck="false">pass the code

 CREATIVE CODING RELAY

JOIN US

10:00 AM – 6:00 PM
SAT, APRIL 17, 2027

808 COMMONWEALTH AVE.
BOSTON, MA</textarea>
      <div class="music-row">
        <label class="file-label">Choose music <input id="music" type="file" accept="audio/*,.mp3"></label>
        <button id="play" type="button">Pause demo</button>
      </div>
      <p id="track-name">No track selected · generated wave</p>
      <label class="text-label" for="background-file">Background</label>
      <div class="background-actions">
        <label class="file-label">Upload image / video<input id="background-file" type="file" accept="image/*,video/*" aria-label="Upload background image or video"></label>
        <button id="background-remove" type="button" hidden>Remove</button>
      </div>
      <p id="background-name" role="status" hidden></p>
      <label class="range-label" for="color-mode">Color mode</label>
      <select id="color-mode">
        <option value="original">Original colors</option>
        <option value="music" selected>Follow music</option>
        <option value="seed">Seeded colors</option>
      </select>
      <div class="seed-row">
        <label for="seed">Seed</label>
        <input id="seed" type="number" min="0" max="4294967295" step="1" value="42">
        <button id="refresh-seed" type="button">↻ Shuffle</button>
      </div>
      <label class="range-label" for="intensity"><span>Response</span><output id="intensity-value">100%</output></label>
      <input id="intensity" type="range" min="20" max="180" value="100">
      <label class="range-label" for="spread"><span>Gradient reach</span><output id="spread-value">100%</output></label>
      <input id="spread" type="range" min="40" max="180" value="100">
      <label class="range-label" for="blur"><span>Gradient blur · relative to type</span><output id="blur-value">1.5</output></label>
      <input id="blur" type="range" min="0" max="16" value="1.5" step="0.5">
      <label class="range-label" for="size"><span>Type size</span><output id="size-value">100%</output></label>
      <input id="size" type="range" min="65" max="400" value="100">
      <label class="range-label" for="tracking"><span>Letter spacing</span><output id="tracking-value">0.00 em</output></label>
      <input id="tracking" type="range" min="-3" max="20" value="0" step="1">
      <label class="range-label" for="word-gap"><span>Word spacing</span><output id="word-gap-value">0.00 em</output></label>
      <input id="word-gap" type="range" min="-8" max="60" value="0" step="1">
      <label class="range-label" for="line-spacing"><span>Line spacing</span><output id="line-spacing-value">0%</output></label>
      <input id="line-spacing" type="range" min="0" max="150" value="0" step="1">
      <label class="range-label">Cursor size <output data-cursor-size-value>100%</output></label>
      <input data-cursor-size aria-label="Cursor size" type="range" min="24" max="96" value="48">
    </aside>
  </main>
</body>
</html>
