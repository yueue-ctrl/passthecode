<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pass the Code — Cursor demo</title>
  <link rel="stylesheet" href="cursor-demo.css?v=cone-rotation-reverse"><link rel="stylesheet" href="cursors.css?v=live-cone-disc">
  <script src="cursors.js?v=exclusive-live-cursor" defer></script><script src="cursor-demo.js?v=color-click-only" defer></script>
</head>
<body>
  <main tabindex="0" id="demo-stage" aria-label="Animated cursor interaction demonstration">
    <header class="demo-heading"><span>PASS THE CODE / CURSORS</span><span id="scene-counter">01 / 02</span></header>
    <aside class="demo-sidebar" aria-label="Demonstration chapters">
      <span class="sidebar-eyebrow">NOW SHOWING</span>
      <div id="demo-chapters"><span id="chapter-dot" aria-hidden="true"></span><div id="chapter-list"></div></div>
      <span id="scene-title" class="sr-only">Cursor</span>
      <p id="scene-detail">Click the cone to pass to the next color.</p>
    </aside>
    <canvas id="cone-demo" role="button" tabindex="0" aria-label="Change cursor cone color"></canvas>
    <canvas id="loading-disc" aria-label="Cursor beam sweeping color into a loading disc" hidden></canvas>
    <div id="demo-progress" aria-hidden="true"></div>
  </main>
  <nav class="demo-dock" aria-label="Demo controls">
    <a href="./">↖ Editor</a><button id="demo-play" type="button">Pause</button>

    <button id="demo-fullscreen" type="button">Full screen ↗</button>
  </nav>
  <span id="demo-status" role="status" class="sr-only"></span>
</body></html>
