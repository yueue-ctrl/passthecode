<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pass the Code</title>
  <link rel="stylesheet" href="style.css?v=cursor-library">
  <script src="replay.js?v=cursor-library" defer></script>
  <script src="editor.js?v=bloom" defer></script>
  <script src="cursors.js?v=spectrum" defer></script>
</head>
<body>
  <main id="stage">
    <button id="cursor-library-toggle" type="button" aria-expanded="false" aria-controls="cursor-library">Cursors <span aria-hidden="true">◧</span></button>
    <div id="mirror" aria-hidden="true"></div>
    <div id="ink" aria-hidden="true"></div>
    <textarea id="text" aria-label="Edit text" aria-keyshortcuts="Alt+1 Alt+2 Alt+3 Alt+4 Alt+5 Meta+Enter Control+Enter" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div id="effects" aria-hidden="true"><div id="caret" class="beam"></div></div>
    <div id="ink-names" aria-hidden="true"></div>
    <ol id="handoffs" aria-label="Handoff history"></ol>
    <div id="controls">
      <a id="open-waves" href="wave.html">Type waves ↗</a>
      <button id="open-replay" type="button">Replay</button>
      <button id="pass" type="button">Pass ↗</button>
      <button id="color-toggle" type="button" popovertarget="colors" aria-label="Choose next collaborator"></button>
    </div>
    <div id="colors" popover>
      <div id="next-label">Pass to</div>
      <div id="swatches" role="group" aria-label="Next collaborator"></div>
      <label id="opacity-control">Opacity <input id="opacity" type="range" min="10" max="70" value="55"></label>
      <label class="text-color-control">Text color <input id="editor-text-color" type="color" value="#191916"></label>
      <label class="text-color-control">Background <input id="editor-background" type="color" value="#ffffff"></label>
      <label id="view-control">View
        <select id="ink-view">
          <option value="wash">Text gradient</option>
          <option value="rail">Left rail</option>
          <option value="stack">Soft stack</option>
        </select>
      </label>
    </div>
  </main>
  <aside id="cursor-library" aria-label="Cursor library" hidden>
    <header class="cursor-library-header">
      <div><span class="cursor-eyebrow">PASS THE CODE / 01</span><h2>Cursor library</h2></div>
      <button id="cursor-library-close" type="button" aria-label="Close cursor library">×</button>
    </header>
    <div id="cursor-palette" role="group" aria-label="Cursor gradient starting color"></div>
    <label class="cursor-enable"><input id="cursor-enable" type="checkbox" checked> Use in editor</label>
    <div id="cursor-grid" role="group" aria-label="Cursor styles"></div>
    <div id="cursor-test" tabindex="0" aria-label="Try selected cursor">
      <img id="cursor-test-image" alt="">
      <span id="cursor-test-name">Normal</span>
      <small>Move here to try</small>
    </div>
    <p class="cursor-note">Five colors in every cursor. Pass shifts the gradient’s starting color.</p>
  </aside>
  <dialog id="replay-dialog" aria-label="Edit replay">
    <canvas id="replay-canvas" width="1280" height="720" aria-label="Abstract playback of edits"></canvas>
    <div id="replay-controls">
      <label>Music <input id="replay-music" type="file" accept=".mp3,audio/mpeg"></label>
      <label><input id="replay-words" type="checkbox"> Show original text</label>
      <label class="text-color-control">Text color <input id="replay-text-color" type="color" value="#191916"></label>
      <label class="text-color-control">Background <input id="replay-background" type="color" value="#ffffff"></label>
      <label><input id="replay-full-layout" type="checkbox"> Stagger words in place</label>
      <label>Text size <input id="replay-font-size" type="range" min="50" max="220" value="100"></label>
      <label>Color intensity <input id="replay-ink-strength" type="range" min="0" max="150" value="100"></label>
      <label>Color size <input id="replay-ink-size" type="range" min="35" max="200" value="100"></label>
      <button id="replay-play" type="button">Play</button>
      <button id="replay-stop" type="button" disabled>Stop</button>
      <button id="replay-export" type="button">Export video</button>
      <button id="replay-close" type="button">Back to editor</button>
      <span id="replay-status" role="status"></span>
    </div>
  </dialog>
  <span id="announcement" class="sr-only" role="status"></span>
</body>
</html>
